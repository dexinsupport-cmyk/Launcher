name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- NEW STEP: the Android project lives zipped inside the repo,
      # so it has to be extracted before gradlew (or anything else) can be used. ---
      - name: Extract project archive
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -name *.zip | head -n 1)
          if [ -z $ZIP_FILE ]; then
            echo No zip file found in repo root
            exit 1
          fi
          echo Extracting $ZIP_FILE
          mkdir -p project_src
          unzip -q $ZIP_FILE -d project_src

          GRADLEW_PATH=$(find project_src -maxdepth 4 -name gradlew | head -n 1)
          if [ -z $GRADLEW_PATH ]; then
            echo Could not find gradlew inside the extracted archive
            find project_src -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname $GRADLEW_PATH)
          echo Found project at $PROJECT_DIR
          echo PROJECT_DIR=$PROJECT_DIR >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install ndk\;25.2.9519653 cmake\;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
