name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- NEW STEP: the Android project lives zipped inside the repo,
      # so it has to be extracted before gradlew (or anything else) can be used. ---
      - name: Extract project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No .zip file found in repo root."
            exit 1
          fi
          echo "Extracting $ZIP_FILE ..."
          mkdir -p project_src
          unzip -q "$ZIP_FILE" -d project_src

          # The zip might contain the project directly, or wrap it in one
          # extra top-level folder. Either way, locate gradlew and use its
          # directory as the real project root for every step after this one.
          GRADLEW_PATH=$(find project_src -maxdepth 4 -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Could not find gradlew anywhere inside the extracted archive."
            find project_src -maxdepth 3
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project at: $PROJEC
