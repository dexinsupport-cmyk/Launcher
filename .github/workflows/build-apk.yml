name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
          cache-dependency-path: data/gradle/wrapper/gradle-wrapper.properties

      - name: Make Gradle executable
        working-directory: data
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: data
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKuzia-debug-apk
          path: data/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
