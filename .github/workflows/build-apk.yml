name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت سورس
      - name: Checkout
        uses: actions/checkout@v4

      # 2. نصب Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      # 3. پیدا کردن Gradle Wrapper در هر مسیری
      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Repository files:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -300

          echo ""
          echo "Searching for gradlew..."

          GRADLEW=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "gradlew" \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found anywhere in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          echo "Gradle project directory:"
          echo "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::Gradle settings file was not found."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::Android app directory was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 4. نمایش ساختار پروژه
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Gradle wrapper:"
          ls -la "$PROJECT_DIR/gradlew"

          echo ""
          echo "Wrapper properties:"
          cat "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

      # 5. آماده‌سازی Gradle
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e
          chmod +x "$PROJECT_DIR/gradlew"

      # 6. نمایش نسخه Gradle
      - name: Check Gradle
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew --version

      # 7. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Building project from:"
          pwd

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon \
            --no-parallel

      # 8. پیدا کردن APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK files..."

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

      # 9. آپلود APK به عنوان Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NKuzia-debug-apk
          path: |
            **/*.apk
          if-no-files-found: error
          retention-days: 7
