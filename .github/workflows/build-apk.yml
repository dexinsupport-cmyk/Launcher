name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Locate gradlew
        shell: bash
        run: |
          set -e

          echo "Repository contents (top level):"
          ls -la

          GRADLEW=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found anywhere in the repository."
            echo "This means gradlew was never committed/pushed to GitHub, even though it exists in your local project."
            echo "Check your repository on GitHub — 'gradlew' should sit at the repo root next to gradlew.bat and settings.gradle.kts."
            echo "If it's missing there, re-add it with 'git add -f gradlew' and push again (web upload sometimes drops extensionless executable files)."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found gradlew at: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.2.11394342

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
