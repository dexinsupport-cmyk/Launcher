name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Find and extract ZIP if present
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP in repo: $ZIP_FILE"
            echo "Extracting it so the project files are available to Gradle..."
            mkdir -p "$GITHUB_WORKSPACE/extracted"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"
            echo "Extracted contents:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 3 -type f | head -100
          else
            echo "No ZIP file found in repo root — assuming project files are already checked out directly."
          fi

      - name: Locate gradlew
        shell: bash
        run: |
          set -e

          echo "Searching for gradlew..."
          GRADLEW=$(find "$GITHUB_WORKSPACE" -type f -name "gradlew" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew was not found anywhere in the repository or extracted ZIP."
            echo "Repository top level:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Found gradlew at: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.2.11394342

      - name: Find APK
        shell: bash
        run: |
          set -e
          APK=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi
          echo "APK found: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTA-2.11-debug-apk
          path: |
            **/*.apk
          if-no-files-found: error
